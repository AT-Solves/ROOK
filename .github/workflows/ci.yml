name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rook
          POSTGRES_PASSWORD: rook
          POSTGRES_DB: rook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rook" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check rook tests
      - name: Tests (SQLite, rules mode — includes trust, tenancy and MVP-success gates)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          ROOK_TEST_DATABASE_URL: postgresql+psycopg://rook:rook@localhost:5432/rook_test
        run: pytest -q
