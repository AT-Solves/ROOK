name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rook
          POSTGRES_PASSWORD: rook
          POSTGRES_DB: rook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rook" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check rook tests
      - name: Tests (SQLite, rules mode — includes trust, tenancy and MVP-success gates)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          ROOK_TEST_DATABASE_URL: postgresql+psycopg://rook:rook@localhost:5432/rook_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install API for E2E
        run: pip install -r ../backend/requirements.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E + accessibility (Playwright, axe) against the real API
        env:
          ROOK_PYTHON: python
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
